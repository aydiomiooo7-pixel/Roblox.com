<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox - Iniciar sesión</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', 'Gotham', Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0a0a0a;
    }

    /* FONDO 2026: Mosaico más grande y con animación sutil */
    .grid-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 16px;
      padding: 16px;
      filter: brightness(0.2) blur(2px) saturate(0.8);
      z-index: 1;
      animation: bgMove 60s linear infinite;
    }

    @keyframes bgMove {
      0% { transform: scale(1.1) translate(0,0); }
      50% { transform: scale(1.1) translate(-20px, -10px); }
      100% { transform: scale(1.1) translate(0,0); }
    }

    .grid-item {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    /* NAVBAR 2026: Glassmorphism */
    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(10, 10, 10, 0.4);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .logo {
      color: #fff;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -1.5px;
      text-decoration: none;
    }

    .nav-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    /* TARJETA 2026: Más redonda y con glass */
    .main-container {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background-color: rgba(20, 22, 24, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px 35px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
      color: #fff;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    /* BOTÓN 2026: Ahora el principal es NEGRO */
    .roblox-btn {
      width: 100%;
      background-color: #000;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s;
    }

    .roblox-btn:hover {
      background-color: #1a1a1a;
    }

    .divider {
      margin: 22px 0;
      display: flex;
      align-items: center;
      color: #aaa;
      font-size: 12px;
      font-weight: 600;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #333;
    }

    .divider span {
      padding: 0 12px;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      background-color: rgba(0,0,0,0.4);
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    .input-field:focus {
      border-color: #00a2ff;
    }

    /* BOTÓN SECUNDARIO 2026: Ahora es gris */
    .submit-btn {
      width: 100%;
      background-color: #2a2a2a;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: #3a3a3a;
    }

    .terms {
      margin-top: 20px;
      font-size: 11px;
      color: #888;
      line-height: 1.5;
    }

    .terms a {
      color: #00a2ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header class="navbar">

  <main class="main-container">
    <div class="login-card">

      <div class="divider">

      <form onsubmit="iniciarSesionLocal(event)">
        <input type="text" class="input-field" placeholder="Nombre de usuario" required>
        <input type="password" class="input-field" placeholder="Contraseña" required>
        <button type="submit" class="submit-btn">Iniciar sesión</button>
      </form>

      <p class="terms">
        Al iniciar sesión aceptas los <a href="#">Términos</a> y la <a href="#">Política de Privacidad</a>.
      </p>
    </div>
  </main>

</html>
